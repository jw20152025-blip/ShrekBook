<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>House Settings • ShrekBook</title>

<link rel="stylesheet" href="/styles.css">

<style>

body {
    margin: 0;
    background:
        radial-gradient(
            circle at 15% 10%,
            rgba(88,224,111,.12),
            transparent 30%
        ),
        #050806;
    color: #f4fff5;
    font-family: Arial, sans-serif;
}

.page {
    width: min(1000px, calc(100% - 18px));
    margin: 28px auto 80px;
}

.hero {
    padding: 30px;
    border-radius: 25px;
    border: 1px solid rgba(88,224,111,.22);
    background:
        linear-gradient(
            135deg,
            rgba(22,51,28,.9),
            rgba(7,17,10,.95)
        );
}

.hero small {
    color: #58e06f;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-weight: 900;
}

.hero h1 {
    margin: 7px 0;
    font-size: clamp(32px, 7vw, 53px);
}

.hero p {
    color: #96a59a;
}

.back {
    color: #8f9d94;
    text-decoration: none;
}

.panel {
    margin-top: 18px;
    padding: 22px;
    border-radius: 20px;
    background: rgba(12,20,14,.82);
    border: 1px solid rgba(88,224,111,.15);
}

.panel h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 7px;
    font-weight: 800;
}

input,
textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: rgba(0,0,0,.25);
    color: white;
    outline: none;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

.save {
    margin-top: 15px;
    border: 0;
    border-radius: 12px;
    padding: 12px 17px;
    background: #58e06f;
    color: #061008;
    font-weight: 900;
    cursor: pointer;
}

.status {
    margin-top: 10px;
    display: none;
    padding: 11px;
    border-radius: 11px;
}

.status.show {
    display: block;
}

.status.success {
    color: #8cff9d;
    background: rgba(88,224,111,.07);
}

.status.error {
    color: #ffaaaa;
    background: rgba(255,70,70,.07);
}

.members {
    display: grid;
    gap: 9px;
}

.member {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 13px;
    border-radius: 14px;
    background: rgba(255,255,255,.025);
}

.avatar {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: #17351d;
    color: #8cff9d;
    font-weight: 900;
}

.member-info {
    min-width: 0;
    flex: 1;
}

.member-name {
    font-weight: 900;
}

.username {
    color: #758178;
    font-size: 12px;
}

.role {
    padding: 6px 9px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    color: #aeb9b1;
    font-size: 11px;
    font-weight: 800;
}

.role.owner {
    color: #ffd66b;
}

.role.admin {
    color: #8fc7ff;
}

.member-actions {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.small-btn {
    border: 0;
    border-radius: 9px;
    padding: 8px 10px;
    cursor: pointer;
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 11px;
    font-weight: 800;
}

.small-btn.danger {
    color: #ffaaaa;
    background: rgba(255,70,70,.08);
}

.small-btn.blue {
    color: #9ecfff;
    background: rgba(100,170,255,.08);
}

.room-settings {
    display: grid;
    gap: 14px;
}

.room-card {
    padding: 17px;
    border-radius: 16px;
    background: rgba(255,255,255,.025);
    border: 1px solid rgba(255,255,255,.06);
}

.room-card h3 {
    margin: 0 0 5px;
}

.room-card p {
    color: #849188;
    font-size: 13px;
}

.access-list {
    display: grid;
    gap: 6px;
    margin-top: 12px;
}

.access-user {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    border-radius: 10px;
    background: rgba(255,255,255,.035);
}

.access-user span {
    flex: 1;
}

.search-row {
    display: flex;
    gap: 7px;
}

.search-results {
    display: grid;
    gap: 6px;
    margin-top: 7px;
}

.search-result {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px;
    border-radius: 10px;
    background: rgba(255,255,255,.035);
}

.search-result span {
    flex: 1;
}

.muted {
    color: #849188;
}

.loading,
.empty {
    padding: 25px;
    text-align: center;
    color: #849188;
}

@media(max-width:650px) {

    .member {
        align-items: flex-start;
        flex-wrap: wrap;
    }

    .member-actions {
        width: 100%;
        margin-left: 51px;
    }

    .search-row {
        flex-direction: column;
    }
}

</style>
</head>

<body>

<nav class="shrekbook-nav">
    <a href="/">Home</a>
    <a href="/houses.html">🏠 Houses</a>
</nav>


<main class="page">

<section class="hero">

    <a
        id="back-link"
        class="back"
        href="/houses.html"
    >
        ← Back
    </a>

    <small>House Management</small>

    <h1>⚙️ House Settings</h1>

    <p id="hero-description">
        Loading...
    </p>

</section>


<section
    id="general-panel"
    class="panel"
>

    <h2>🏠 General</h2>

    <label for="house-name">
        House name
    </label>

    <input
        id="house-name"
        maxlength="80"
    >


    <label for="house-description">
        Description
    </label>

    <textarea
        id="house-description"
        maxlength="1000"
    ></textarea>


    <button
        class="save"
        onclick="saveSettings()"
    >
        💾 Save Changes
    </button>


    <div
        id="save-status"
        class="status"
    ></div>

</section>


<section class="panel">

    <h2>👥 Members</h2>

    <p class="muted">
        Manage House members and administrators.
    </p>

    <div
        id="members"
        class="members"
    >
        <div class="loading">
            Loading members...
        </div>
    </div>

</section>


<section
    id="bedrooms-panel"
    class="panel"
>

    <h2>🛏️ Bedroom Access</h2>

    <p class="muted">
        Bedroom owners can decide which House members
        are allowed inside.
    </p>

    <div
        id="bedrooms"
        class="room-settings"
    >
        <div class="loading">
            Loading bedrooms...
        </div>
    </div>

</section>

</main>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );


const houseId =
    params.get("id");


let houseData = null;


function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function initials(profile) {

    const text =
        profile?.display_name ||
        profile?.username ||
        "?";

    return text
        .slice(0, 2)
        .toUpperCase();
}


function showStatus(
    message,
    type
) {

    const status =
        document.getElementById(
            "save-status"
        );


    status.textContent =
        message;


    status.className =
        `status show ${type}`;
}


async function loadSettings() {

    if (!houseId) {

        document.getElementById(
            "hero-description"
        ).textContent =
            "No House ID was provided.";

        return;
    }


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}`,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to load House."
            );
        }


        houseData = data;


        const membership =
            data.membership;


        if (
            !membership ||
            !["owner", "admin"].includes(
                membership.role
            )
        ) {

            document.getElementById(
                "hero-description"
            ).textContent =
                "You do not have permission to manage this House.";

            document.getElementById(
                "general-panel"
            ).style.display =
                "none";

            document.getElementById(
                "members"
            ).innerHTML = `
                <div class="empty">
                    🔒 Owner or House Admin access required.
                </div>
            `;

            document.getElementById(
                "bedrooms-panel"
            ).style.display =
                "none";

            return;
        }


        renderSettings();

    } catch (error) {

        document.getElementById(
            "hero-description"
        ).textContent =
            error.message;
    }
}


function renderSettings() {

    const house =
        houseData.house;


    document.title =
        `Settings • ${house.name} • ShrekBook`;


    document.getElementById(
        "back-link"
    ).href =
        `/house.html?id=${encodeURIComponent(
            house.id
        )}`;


    document.getElementById(
        "hero-description"
    ).textContent =
        `Managing ${house.name}`;


    document.getElementById(
        "house-name"
    ).value =
        house.name || "";


    document.getElementById(
        "house-description"
    ).value =
        house.description || "";


    renderMembers();

    renderBedrooms();
}


async function saveSettings() {

    const name =
        document.getElementById(
            "house-name"
        ).value.trim();


    const description =
        document.getElementById(
            "house-description"
        ).value.trim();


    if (!name) {

        showStatus(
            "House name cannot be empty.",
            "error"
        );

        return;
    }


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        name,
                        description
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to save settings."
            );
        }


        houseData.house =
            data.house;


        showStatus(
            "✅ House settings saved!",
            "success"
        );

    } catch (error) {

        showStatus(
            error.message,
            "error"
        );
    }
}


function renderMembers() {

    const container =
        document.getElementById(
            "members"
        );


    const members =
        houseData.members || [];


    const currentRole =
        houseData.membership.role;


    if (!members.length) {

        container.innerHTML =
            `<div class="empty">
                No members.
            </div>`;

        return;
    }


    container.innerHTML =
        members.map(member => {

            const profile =
                member.profile;


            const role =
                member.role;


            const isOwner =
                role === "owner";


            const isAdmin =
                role === "admin";


            let actions = "";


            if (!isOwner) {

                if (
                    currentRole === "owner"
                ) {

                    if (isAdmin) {

                        actions += `
                            <button
                                class="small-btn blue"
                                onclick="demoteAdmin('${member.user_id}')"
                            >
                                Demote
                            </button>
                        `;

                    } else {

                        actions += `
                            <button
                                class="small-btn blue"
                                onclick="promoteAdmin('${member.user_id}')"
                            >
                                Make Admin
                            </button>
                        `;
                    }

                }


                // Owner can remove anyone except themselves.
                // Admin can remove normal members.
                if (
                    currentRole === "owner" ||
                    (
                        currentRole === "admin" &&
                        !isAdmin
                    )
                ) {

                    actions += `
                        <button
                            class="small-btn danger"
                            onclick="removeMember('${member.user_id}')"
                        >
                            Remove
                        </button>
                    `;
                }
            }


            return `

                <div class="member">

                    <div class="avatar">
                        ${escapeHtml(
                            initials(profile)
                        )}
                    </div>

                    <div class="member-info">

                        <div class="member-name">
                            ${escapeHtml(
                                profile?.display_name ||
                                profile?.username ||
                                "Unknown"
                            )}
                        </div>

                        <div class="username">
                            ${
                                profile?.username
                                    ? "@" +
                                      escapeHtml(
                                          profile.username
                                      )
                                    : ""
                            }
                        </div>

                    </div>

                    <span
                        class="role ${
                            isOwner
                                ? "owner"
                                : isAdmin
                                    ? "admin"
                                    : ""
                        }"
                    >
                        ${
                            isOwner
                                ? "👑 Owner"
                                : isAdmin
                                    ? "🛡️ Admin"
                                    : "Member"
                        }
                    </span>

                    <div class="member-actions">
                        ${actions}
                    </div>

                </div>

            `;

        }).join("");
}


async function promoteAdmin(userId) {

    if (
        !confirm(
            "Make this member a House Admin?"
        )
    ) {
        return;
    }


    await memberAction(
        `/api/houses/${encodeURIComponent(houseId)}/admins/${encodeURIComponent(userId)}`,
        "POST",
        "Member promoted to Admin."
    );
}


async function demoteAdmin(userId) {

    if (
        !confirm(
            "Remove this member's Admin privileges?"
        )
    ) {
        return;
    }


    await memberAction(
        `/api/houses/${encodeURIComponent(houseId)}/admins/${encodeURIComponent(userId)}`,
        "DELETE",
        "Admin privileges removed."
    );
}


async function removeMember(userId) {

    if (
        !confirm(
            "Remove this member from the House?"
        )
    ) {
        return;
    }


    await memberAction(
        `/api/houses/${encodeURIComponent(houseId)}/members/${encodeURIComponent(userId)}`,
        "DELETE",
        "Member removed."
    );
}


async function memberAction(
    url,
    method,
    successMessage
) {

    try {

        const response =
            await fetch(
                url,
                {
                    method,
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Action failed."
            );
        }


        showStatus(
            `✅ ${successMessage}`,
            "success"
        );


        await reloadHouse();

    } catch (error) {

        showStatus(
            error.message,
            "error"
        );
    }
}


async function reloadHouse() {

    const response =
        await fetch(
            `/api/houses/${encodeURIComponent(houseId)}`,
            {
                credentials: "include"
            }
        );


    const data =
        await response.json();


    if (!response.ok) {
        throw new Error(
            data.error ||
            "Failed to reload House."
        );
    }


    houseData = data;

    renderSettings();
}


function renderBedrooms() {

    const container =
        document.getElementById(
            "bedrooms"
        );


    const rooms =
        (houseData.rooms || [])
            .filter(
                room =>
                    room.room_type ===
                    "bedroom"
            );


    if (!rooms.length) {

        container.innerHTML =
            `<div class="empty">
                No bedrooms found.
            </div>`;

        return;
    }


    container.innerHTML =
        rooms.map(room => `

            <div
                class="room-card"
                id="room-card-${room.id}"
            >

                <h3>
                    🛏️ ${escapeHtml(room.name)}
                </h3>

                <p>
                    Owner:
                    ${
                        escapeHtml(
                            room.bedroomOwner?.display_name ||
                            room.bedroomOwner?.username ||
                            "Unknown"
                        )
                    }
                </p>

                ${
                    room.user_id ===
                    houseData.membership.user_id
                        ? `
                            <strong>
                                You own this bedroom.
                            </strong>
                        `
                        : `
                            <div class="muted">
                                Only the bedroom owner can
                                change its access.
                            </div>
                        `
                }

                ${
                    room.user_id ===
                    houseData.membership.user_id
                        ? `
                            <div
                                id="access-${room.id}"
                                class="access-list"
                            >
                                Loading access...
                            </div>

                            <div style="margin-top:13px">

                                <div class="search-row">

                                    <input
                                        id="bed-search-${room.id}"
                                        placeholder="Search House members..."
                                        oninput="searchBedroomUsers(${room.id})"
                                    >

                                </div>

                                <div
                                    id="bed-results-${room.id}"
                                    class="search-results"
                                ></div>

                            </div>
                        `
                        : ""
                }

            </div>

        `).join("");


    rooms.forEach(room => {

        if (
            room.user_id ===
            houseData.membership.user_id
        ) {

            loadBedroomAccess(
                room.id
            );
        }

    });
}


async function loadBedroomAccess(roomId) {

    const container =
        document.getElementById(
            `access-${roomId}`
        );


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}/access`,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to load access."
            );
        }


        const access =
            data.access || [];


        if (!access.length) {

            container.innerHTML =
                `<div class="muted">
                    🔒 Nobody else has access.
                </div>`;

            return;
        }


        container.innerHTML =
            access.map(item => {

                const profile =
                    item.profile;


                return `

                    <div class="access-user">

                        <span>
                            👤 ${
                                escapeHtml(
                                    profile?.display_name ||
                                    profile?.username ||
                                    "Unknown"
                                )
                            }
                        </span>

                        <button
                            class="small-btn danger"
                            onclick="revokeAccess(
                                ${roomId},
                                '${item.user_id}'
                            )"
                        >
                            Revoke
                        </button>

                    </div>

                `;

            }).join("");

    } catch (error) {

        container.innerHTML =
            `<div style="color:#ffaaaa">
                ${escapeHtml(error.message)}
            </div>`;
    }
}


let bedroomSearchTimers = {};


function searchBedroomUsers(roomId) {

    clearTimeout(
        bedroomSearchTimers[roomId]
    );


    bedroomSearchTimers[roomId] =
        setTimeout(
            () =>
                performBedroomSearch(
                    roomId
                ),
            250
        );
}


async function performBedroomSearch(roomId) {

    const input =
        document.getElementById(
            `bed-search-${roomId}`
        );


    const results =
        document.getElementById(
            `bed-results-${roomId}`
        );


    const query =
        input.value.trim();


    if (query.length < 1) {

        results.innerHTML = "";

        return;
    }


    try {

        const response =
            await fetch(
                `/api/users/search?q=${encodeURIComponent(query)}`,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Search failed."
            );
        }


        const users =
            data.users || [];


        const memberIds =
            new Set(
                (houseData.members || [])
                    .map(
                        m => m.user_id
                    )
            );


        const bedroom =
            (houseData.rooms || [])
                .find(
                    r =>
                        Number(r.id) ===
                        Number(roomId)
                );


        const ownerId =
            bedroom?.user_id;


        const filtered =
            users.filter(
                user =>
                    memberIds.has(user.id) &&
                    user.id !== ownerId
            );


        if (!filtered.length) {

            results.innerHTML =
                `<div class="muted">
                    No matching House members.
                </div>`;

            return;
        }


        results.innerHTML =
            filtered.map(user => `

                <div class="search-result">

                    <span>
                        ${
                            escapeHtml(
                                user.display_name ||
                                user.username ||
                                "Unknown"
                            )
                        }
                    </span>

                    <button
                        class="small-btn blue"
                        onclick="grantAccess(
                            ${roomId},
                            '${user.id}'
                        )"
                    >
                        Grant
                    </button>

                </div>

            `).join("");

    } catch (error) {

        results.innerHTML =
            `<div style="color:#ffaaaa">
                ${escapeHtml(error.message)}
            </div>`;
    }
}


async function grantAccess(
    roomId,
    userId
) {

    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}/access`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        user_id: userId
                    })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to grant access."
            );
        }


        const input =
            document.getElementById(
                `bed-search-${roomId}`
            );


        const results =
            document.getElementById(
                `bed-results-${roomId}`
            );


        input.value = "";

        results.innerHTML = "";


        await loadBedroomAccess(
            roomId
        );

    } catch (error) {

        alert(
            error.message
        );
    }
}


async function revokeAccess(
    roomId,
    userId
) {

    if (
        !confirm(
            "Revoke this person's bedroom access?"
        )
    ) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}/access/${encodeURIComponent(userId)}`,
                {
                    method: "DELETE",

                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to revoke access."
            );
        }


        await loadBedroomAccess(
            roomId
        );

    } catch (error) {

        alert(
            error.message
        );
    }
}


loadSettings();

</script>

</body>
</html>
