<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>House — ShrekBook</title>

<link rel="stylesheet" href="/styles.css">

<style>
body {
    margin: 0;
    background:
        radial-gradient(circle at top left, rgba(80,255,160,.1), transparent 35%),
        #080b10;
    color: white;
    font-family: Arial, sans-serif;
}

.house-container {
    max-width: 1150px;
    margin: auto;
    padding: 30px 20px 80px;
}

.hero {
    padding: 35px;
    border-radius: 28px;
    background: linear-gradient(
        135deg,
        rgba(20,32,28,.96),
        rgba(10,15,21,.96)
    );
    border: 1px solid rgba(100,255,170,.2);
}

.hero-top {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
}

.hero h1 {
    margin: 0;
    font-size: clamp(36px, 6vw, 62px);
}

.type-badge {
    display: inline-block;
    margin-top: 10px;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(90,255,160,.1);
    color: #75ffac;
    font-weight: bold;
}

.description {
    color: #a6b1bd;
    max-width: 750px;
    line-height: 1.6;
}

.stats {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    margin-top: 25px;
}

.stat {
    padding: 18px;
    border-radius: 17px;
    background: rgba(255,255,255,.035);
}

.stat small {
    display: block;
    color: #8995a3;
    margin-bottom: 5px;
}

.section {
    margin-top: 25px;
}

.section h2 {
    font-size: 28px;
}

.room-grid,
.member-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(240px, 1fr));
    gap: 15px;
}

.room-card,
.member-card {
    padding: 20px;
    border-radius: 20px;
    background: rgba(15,20,28,.92);
    border: 1px solid rgba(255,255,255,.07);
}

.room-card:hover {
    border-color: rgba(100,255,170,.3);
}

.room-icon {
    font-size: 35px;
}

.room-private {
    color: #ffcc72;
}

.room-public {
    color: #73ffab;
}

.member-card {
    display: flex;
    align-items: center;
    gap: 12px;
}

.avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    object-fit: cover;
    background: #171e27;
}

.member-info {
    min-width: 0;
}

.member-name {
    font-weight: bold;
}

.member-username {
    color: #8995a3;
    font-size: 13px;
}

.role {
    margin-left: auto;
    font-size: 12px;
    color: #7dffb1;
}

.button {
    display: inline-block;
    border: 0;
    padding: 11px 15px;
    border-radius: 12px;
    background: #16221b;
    color: white;
    text-decoration: none;
    cursor: pointer;
    font-weight: bold;
}

.button.primary {
    background: linear-gradient(135deg,#38dc79,#159b54);
}

.button.danger {
    background: #30151a;
    color: #ff8e9b;
}

.invite-box {
    padding: 20px;
    border-radius: 20px;
    background: rgba(255,255,255,.025);
}

.invite-search {
    display: flex;
    gap: 10px;
}

.invite-search input {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: #0b1017;
    color: white;
}

.search-results {
    margin-top: 12px;
    display: grid;
    gap: 8px;
}

.search-user {
    padding: 12px;
    border-radius: 12px;
    background: rgba(255,255,255,.04);
    cursor: pointer;
}

.search-user:hover {
    background: rgba(100,255,170,.08);
}

.notice {
    text-align: center;
    color: #8d99a6;
    padding: 40px;
}
</style>

</head>

<body>

<nav class="shrekbook-nav">

<a href="/">Home</a>
<a href="/profile.html">Profile</a>
<a href="/shrekchat.html">💬 ShrekChat</a>
<a href="/shreksearch.html">🔎 ShrekSearch</a>
<a href="/houses.html">🏠 Houses</a>

</nav>


<main class="house-container">

<div id="content">

<div class="notice">
🏠 Loading House...
</div>

</div>

</main>


<script>

const params =
    new URLSearchParams(location.search);

const houseId =
    params.get("id");


if (!houseId) {

    document.getElementById("content")
        .innerHTML = `
            <div class="notice">
                😭 No House ID was provided.
            </div>
        `;

} else {

    loadHouse();
}


async function loadHouse() {

    const content =
        document.getElementById("content");

    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}`,
                {
                    credentials: "include"
                }
            );


        const raw =
            await response.text();

        let data;

        try {
            data = JSON.parse(raw);
        } catch {

            console.error(raw);

            throw new Error(
                "Server returned invalid JSON."
            );
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load House."
            );
        }


        // ----------------------------------------------------
        // EXPECTED API CONTRACT
        // ----------------------------------------------------

        const house =
            data.house;

        if (!house) {

            console.error(
                "Invalid House response:",
                data
            );

            throw new Error(
                "Invalid House response."
            );
        }


        const houseType =
            data.houseType ||
            null;

        const owner =
            data.owner ||
            null;

        const rooms =
            Array.isArray(data.rooms)
                ? data.rooms
                : [];

        const members =
            Array.isArray(data.members)
                ? data.members
                : [];


                const taxReduction =
                        houseType
                                ? Number(
                                        houseType.tax_reduction_percent || 0
                                    )
                                : 0;


        content.innerHTML = `

            <section class="hero">

                <div class="hero-top">

                    <div>

                        <h1>
                            🏠 ${escapeHtml(
                                house.name
                            )}
                        </h1>

                        <div class="type-badge">
                            ${escapeHtml(
                                houseType?.name ||
                                house.house_type ||
                                "House"
                            )}
                        </div>

                    </div>

                    <div>

                        <a
                            class="button"
                            href="/houses.html"
                        >
                            ← Houses
                        </a>

                        ${
                            data.membership &&
                            ["owner","admin"]
                                .includes(
                                    data.membership.role
                                )
                                ? `
                                    <a
                                        class="button"
                                        href="/house-settings.html?id=${encodeURIComponent(house.id)}"
                                    >
                                        ⚙️ Settings
                                    </a>
                                `
                                : ""
                        }

                    </div>

                </div>


                <p class="description">
                    ${escapeHtml(
                        house.description ||
                        "No description."
                    )}
                </p>


                <div class="stats">

                    <div class="stat">

                        <small>Owner</small>

                        👑 ${
                            escapeHtml(
                                owner?.display_name ||
                                owner?.username ||
                                "Unknown"
                            )
                        }

                    </div>


                    <div class="stat">

                        <small>Rooms</small>

                        🚪 ${rooms.length}

                    </div>


                    <div class="stat">

                        <small>Members</small>

                        👥 ${members.length}

                    </div>


                    <div class="stat">

                        <small>Marketplace Tax Reduction</small>

                        <strong
                            style="color:#74ffab"
                        >
                            ${taxReduction
                                ? `-${taxReduction.toFixed(1)}%`
                                : "0.0%"
                            }
                        </strong>

                    </div>

                </div>

            </section>


            <section class="section">

                <h2>🚪 Rooms</h2>

                <div class="room-grid">

                    ${
                        rooms.length
                            ? rooms.map(room => {

                                const privateRoom =
                                    room.room_type ===
                                    "bedroom";

                                return `

                                    <article
                                        class="room-card"
                                    >

                                        <div
                                            class="room-icon"
                                        >
                                            ${
                                                privateRoom
                                                    ? "🛏️"
                                                    : "🛋️"
                                            }
                                        </div>

                                        <h3>
                                            ${escapeHtml(
                                                room.name
                                            )}
                                        </h3>

                                        <p class="${
                                            privateRoom
                                                ? "room-private"
                                                : "room-public"
                                        }">

                                            ${
                                                privateRoom
                                                    ? "🔒 Private Bedroom"
                                                    : "🌐 Public Room"
                                            }

                                        </p>

                                        ${
                                            privateRoom &&
                                            room.bedroomOwner
                                                ? `
                                                    <p>
                                                        👤 Bedroom of
                                                        <strong>
                                                            ${escapeHtml(
                                                                room.bedroomOwner.display_name ||
                                                                room.bedroomOwner.username
                                                            )}
                                                        </strong>
                                                    </p>
                                                `
                                                : ""
                                        }

                                        <a
                                            class="button primary"
                                            href="/house-room.html?house=${encodeURIComponent(house.id)}&room=${encodeURIComponent(room.id)}"
                                        >
                                            Enter Room →
                                        </a>

                                    </article>

                                `;

                            }).join("")
                            : `
                                <div class="notice">
                                    No rooms found.
                                </div>
                            `
                    }

                </div>

            </section>


            <section class="section">

                <h2>👥 Members</h2>

                <div class="member-grid">

                    ${
                        members.map(member => {

                            const profile =
                                member.profile ||
                                {};

                            return `

                                <div class="member-card">

                                    ${
                                        profile.avatar_url
                                            ? `
                                                <img
                                                    class="avatar"
                                                    src="${escapeHtml(
                                                        profile.avatar_url
                                                    )}"
                                                >
                                            `
                                            : `
                                                <div
                                                    class="avatar"
                                                    style="
                                                        display:grid;
                                                        place-items:center;
                                                        font-size:22px;
                                                    "
                                                >
                                                    👤
                                                </div>
                                            `
                                    }

                                    <div class="member-info">

                                        <div class="member-name">

                                            ${escapeHtml(
                                                profile.display_name ||
                                                profile.username ||
                                                "Unknown"
                                            )}

                                        </div>

                                        <div class="member-username">

                                            @${escapeHtml(
                                                profile.username ||
                                                "unknown"
                                            )}

                                        </div>

                                    </div>

                                    <div class="role">

                                        ${escapeHtml(
                                            member.role
                                        )}

                                    </div>

                                    ${
                                        data.membership &&
                                        ["owner", "admin"].includes(
                                            data.membership.role
                                        ) &&
                                        member.role !== "owner"
                                            ? `
                                                <button
                                                    onclick='toggleAdmin(${JSON.stringify(member.user_id)}, ${JSON.stringify(member.role)})'>
                                                    ${
                                                        member.role === "admin"
                                                            ? "Demote"
                                                            : "Make Admin"
                                                    }
                                                </button>

                                                <button
                                                    class="danger"
                                                    onclick='removeMember(${JSON.stringify(member.user_id)})'>
                                                    Remove
                                                </button>
                                            `
                                            : ""
                                    }

                                </div>

                            `;

                        }).join("")
                    }

                </div>

            </section>


            <section class="section">

                <h2>📨 Invite Someone</h2>

                <div class="invite-box">

                    <div class="invite-search">

                        <input
                            id="user-search"
                            placeholder="Search ShrekBook users..."
                            autocomplete="off"
                        >

                        <button
                            class="button primary"
                            onclick="searchUsers()"
                        >
                            Search
                        </button>

                    </div>

                    <div
                        id="search-results"
                        class="search-results"
                    ></div>

                </div>

            </section>

        `;


        const search =
            document.getElementById(
                "user-search"
            );

        search.addEventListener(
            "keydown",
            event => {

                if (event.key === "Enter") {
                    searchUsers();
                }

            }
        );

    } catch (error) {

        console.error(error);

        content.innerHTML = `

            <div class="notice">

                <div style="font-size:55px">
                    😭
                </div>

                <h2>
                    Couldn't load House
                </h2>

                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>

                <button
                    class="button"
                    onclick="loadHouse()"
                >
                    Try Again
                </button>

            </div>

        `;
    }
}


async function searchUsers() {

    const input =
        document.getElementById(
            "user-search"
        );

    const results =
        document.getElementById(
            "search-results"
        );

    const query =
        input.value.trim();

    if (!query) {

        results.innerHTML =
            "<p>Type something to search.</p>";

        return;
    }


    results.innerHTML =
        "🔎 Searching...";


    try {

        const response =
            await fetch(
                `/api/users/search?q=${encodeURIComponent(query)}`,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Search failed."
            );
        }


        const users =
            Array.isArray(data.users)
                ? data.users
                : [];


        if (!users.length) {

            results.innerHTML =
                "<p>No users found.</p>";

            return;
        }


        results.innerHTML =
            users.map(user => `

                <div
                    class="search-user"
                    onclick="inviteUser('${user.id}')"
                >

                    👤

                    <strong>
                        ${escapeHtml(
                            user.display_name ||
                            user.username
                        )}
                    </strong>

                    @${escapeHtml(
                        user.username
                    )}

                    <span style="float:right">
                        ➕ Invite
                    </span>

                </div>

            `).join("");


    } catch (error) {

        results.innerHTML =
            `😭 ${escapeHtml(
                error.message
            )}`;
    }
}


async function inviteUser(userId) {

    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/invite`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        userId
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to invite user."
            );
        }


        alert("📨 Invitation sent!");

    } catch (error) {

        alert(
            "😭 " + error.message
        );
    }
}

async function toggleAdmin(userId, role) {
    const method = role === "admin" ? "DELETE" : "POST";

    try {
        const response = await fetch(
            `/api/houses/${encodeURIComponent(houseId)}/admins/${encodeURIComponent(userId)}`,
            { method, credentials: "include" }
        );
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not change admin status.");
        }

        await loadHouse();
    } catch (error) {
        alert("😭 " + error.message);
    }
}

async function removeMember(userId) {
    if (!confirm("Remove this member from the House?")) return;

    try {
        const response = await fetch(
            `/api/houses/${encodeURIComponent(houseId)}/members/${encodeURIComponent(userId)}`,
            { method: "DELETE", credentials: "include" }
        );
        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Could not remove member.");
        }

        await loadHouse();
    } catch (error) {
        alert("😭 " + error.message);
    }
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
