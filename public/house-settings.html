<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>House Settings — ShrekBook</title>

<link rel="stylesheet" href="/styles.css">

<style>
body {
    margin: 0;
    background:
        radial-gradient(circle at top left, rgba(100,255,170,.1), transparent 35%),
        #080b10;
    color: white;
    font-family: Arial, sans-serif;
}

.settings-page {
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px 80px;
}

.settings-card {
    padding: 30px;
    margin-bottom: 20px;
    border-radius: 25px;
    background: rgba(15,20,28,.95);
    border: 1px solid rgba(255,255,255,.07);
}

.settings-card h1,
.settings-card h2 {
    margin-top: 0;
}

.field {
    margin-top: 18px;
}

.field label {
    display: block;
    margin-bottom: 7px;
    font-weight: bold;
}

.field input,
.field textarea {
    width: 100%;
    padding: 13px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.1);
    background: #090e14;
    color: white;
    font: inherit;
}

.field textarea {
    min-height: 130px;
    resize: vertical;
}

.button {
    border: 0;
    padding: 12px 16px;
    border-radius: 12px;
    background: #17241c;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.button.primary {
    background: linear-gradient(135deg,#38dc79,#159b54);
}

.member {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    margin-top: 9px;
    border-radius: 14px;
    background: rgba(255,255,255,.035);
}

.avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    background: #18202a;
}

.member-info {
    flex: 1;
}

.username {
    color: #778391;
    font-size: 13px;
}

.role {
    color: #76ffab;
    font-size: 13px;
}

.notice {
    text-align: center;
    padding: 45px;
    color: #8e99a5;
}

.status {
    margin-top: 12px;
    min-height: 20px;
}
</style>

</head>

<body>

<nav class="shrekbook-nav">

<a href="/">Home</a>
<a href="/houses.html">🏠 Houses</a>

</nav>


<main class="settings-page">

<div id="page">

<div class="notice">
⚙️ Loading House Settings...
</div>

</div>

</main>


<script>

const params =
    new URLSearchParams(
        location.search
    );

const houseId =
    params.get("id");


let houseData = null;


if (!houseId) {

    showError(
        "No House ID was provided."
    );

} else {

    loadSettings();
}


async function loadSettings() {

    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}`,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load House."
            );
        }


        if (!data.house) {

            throw new Error(
                "Invalid House response."
            );
        }


        houseData = data;


        const membership =
            data.membership;


        if (
            !membership ||
            !["owner", "admin"]
                .includes(membership.role)
        ) {

            throw new Error(
                "You do not have permission to access House Settings."
            );
        }


        render();

    } catch (error) {

        showError(
            error.message
        );
    }
}


function render() {

    const page =
        document.getElementById("page");

    const house =
        houseData.house;

    const type =
        houseData.houseType ||
        {};

    const members =
        Array.isArray(
            houseData.members
        )
            ? houseData.members
            : [];


    page.innerHTML = `

        <section class="settings-card">

            <h1>
                ⚙️ ${escapeHtml(
                    house.name
                )}
            </h1>

            <p>
                Manage your House information
                and members.
            </p>

            <div class="field">

                <label>
                    House Name
                </label>

                <input
                    id="house-name"
                    maxlength="80"
                    value="${escapeHtml(
                        house.name
                    )}"
                >

            </div>


            <div class="field">

                <label>
                    Description
                </label>

                <textarea
                    id="house-description"
                    maxlength="1000"
                >${escapeHtml(
                    house.description || ""
                )}</textarea>

            </div>


            <div class="field">

                <p>
                    🏠 House Type:
                    <strong>
                        ${escapeHtml(
                            type.name ||
                            house.house_type ||
                            "Unknown"
                        )}
                    </strong>
                </p>

                <p>
                    🚪 Rooms:
                    <strong>
                        ${type.room_count || "?"}
                    </strong>
                </p>

                <p>
                    📉 Marketplace Tax Reduction:
                    <strong style="color:#75ffab">
                        ${
                            Number(
                                type.tax_reduction || 0
                            ) * 100
                        }%
                    </strong>
                </p>

                <small>
                    House Type cannot be changed after
                    creation.
                </small>

            </div>


            <button
                class="button primary"
                onclick="saveHouse()"
            >
                💾 Save Changes
            </button>

            <div
                id="save-status"
                class="status"
            ></div>

        </section>


        <section class="settings-card">

            <h2>
                👑 House Members
            </h2>

            <p>
                The owner can promote members to
                House Admins. Admins can manage
                members but cannot manage other Admins.
            </p>

            <div>

                ${
                    members.map(member => {

                        const profile =
                            member.profile ||
                            {};

                        const isOwner =
                            member.role === "owner";

                        return `

                            <div class="member">

                                ${
                                    profile.avatar_url
                                        ? `
                                            <img
                                                class="avatar"
                                                src="${escapeHtml(
                                                    profile.avatar_url
                                                )}"
                                            >
                                        `
                                        : `
                                            <div
                                                class="avatar"
                                                style="
                                                    display:grid;
                                                    place-items:center;
                                                "
                                            >
                                                👤
                                            </div>
                                        `
                                }

                                <div class="member-info">

                                    <strong>
                                        ${escapeHtml(
                                            profile.display_name ||
                                            profile.username ||
                                            "Unknown"
                                        )}
                                    </strong>

                                    <div class="username">

                                        @${escapeHtml(
                                            profile.username ||
                                            "unknown"
                                        )}

                                    </div>

                                </div>

                                <div class="role">

                                    ${escapeHtml(
                                        member.role
                                    )}

                                </div>


                                ${
                                    !isOwner &&
                                    houseData.membership?.role === "owner"
                                        ? member.role === "admin"
                                            ? `
                                                <button
                                                    class="button"
                                                    onclick="demoteAdmin('${member.user_id}')"
                                                >
                                                    Demote
                                                </button>
                                            `
                                            : `
                                                <button
                                                    class="button"
                                                    onclick="promoteAdmin('${member.user_id}')"
                                                >
                                                    Make Admin
                                                </button>
                                            `
                                        : ""
                                }


                                ${
                                    !isOwner &&
                                    (
                                        houseData.membership?.role === "owner" ||
                                        (
                                            houseData.membership?.role === "admin" &&
                                            member.role === "member"
                                        )
                                    )
                                        ? `
                                            <button
                                                class="button"
                                                onclick="removeMember('${member.user_id}')"
                                            >
                                                Remove
                                            </button>
                                        `
                                        : ""
                                }

                            </div>

                        `;

                    }).join("")

                }

            </div>

        </section>

    `;
}


async function saveHouse() {

    const name =
        document.getElementById(
            "house-name"
        ).value.trim();

    const description =
        document.getElementById(
            "house-description"
        ).value.trim();

    const status =
        document.getElementById(
            "save-status"
        );


    status.textContent =
        "💾 Saving...";


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        name,
                        description
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to save."
            );
        }


        status.textContent =
            "✅ Saved!";

    } catch (error) {

        status.textContent =
            "😭 " + error.message;
    }
}


async function promoteAdmin(userId) {

    if (
        !confirm(
            "Make this member a House Admin?"
        )
    ) return;


    await memberAction(
        `/api/houses/${encodeURIComponent(houseId)}/admins/${encodeURIComponent(userId)}`,
        {
            method: "POST"
        }
    );
}


async function demoteAdmin(userId) {

    if (
        !confirm(
            "Remove this member's Admin role?"
        )
    ) return;


    await memberAction(
        `/api/houses/${encodeURIComponent(houseId)}/admins/${encodeURIComponent(userId)}`,
        {
            method: "DELETE"
        }
    );
}


async function removeMember(userId) {

    if (
        !confirm(
            "Remove this member from the House?"
        )
    ) return;


    await memberAction(
        `/api/houses/${encodeURIComponent(houseId)}/members/${encodeURIComponent(userId)}`,
        {
            method: "DELETE"
        }
    );
}


async function memberAction(url, options) {

    try {

        const response =
            await fetch(
                url,
                {
                    ...options,
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Action failed."
            );
        }


        await loadSettings();

    } catch (error) {

        alert(
            "😭 " + error.message
        );
    }
}


function showError(message) {

    document.getElementById("page")
        .innerHTML = `

            <div class="notice">

                <div style="font-size:55px">
                    😭
                </div>

                <h2>
                    Couldn't load House Settings
                </h2>

                <p>
                    ${escapeHtml(message)}
                </p>

                <a
                    class="button"
                    href="/houses.html"
                >
                    ← Houses
                </a>

            </div>

        `;
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
