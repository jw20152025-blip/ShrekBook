<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>House Room - ShrekBook</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        main {
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
        }

        .box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .back {
            display: inline-block;
            margin-bottom: 15px;
            color: #4b8f29;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        #room h1 {
            margin-bottom: 5px;
        }

        #room p {
            color: #666;
            margin-top: 5px;
        }

        #messages {
            height: 500px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            margin-bottom: 15px;
            background: #fafafa;
        }

        .message {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .message:last-child {
            border-bottom: none;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .avatar-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .username {
            font-weight: bold;
        }

        .time {
            color: #888;
            font-size: 12px;
            margin-top: 5px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            height: 70px;
            resize: none;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        textarea:focus {
            outline: none;
            border-color: #4b8f29;
        }

        button {
            margin-top: 8px;
            padding: 10px 15px;
            background: #4b8f29;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #3d7622;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .error {
            color: #b00020;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 30px;
        }

        .private {
            color: #9a6700;
        }

        .public {
            color: #4b8f29;
        }

    </style>

</head>

<body>

<main>

    <div class="box">

        <a
            id="backLink"
            class="back"
            href="#"
        >
            ← Back to House
        </a>

        <div id="room">
            Loading room...
        </div>

        <div id="messages">
            Loading messages...
        </div>

        <textarea
            id="message"
            placeholder="Write a message..."
            maxlength="2000"
        ></textarea>

        <button id="send">
            Send
        </button>

        <p
            id="error"
            class="error"
        ></p>

    </div>

</main>


<script>

    // ========================================================
    // URL PARAMETERS
    // ========================================================

    const params =
        new URLSearchParams(
            window.location.search
        );

    const houseId =
        params.get("house");

    const roomId =
        params.get("room");


    // ========================================================
    // ELEMENTS
    // ========================================================

    const roomContainer =
        document.getElementById("room");

    const messagesContainer =
        document.getElementById("messages");

    const messageInput =
        document.getElementById("message");

    const errorContainer =
        document.getElementById("error");

    const sendButton =
        document.getElementById("send");

    const backLink =
        document.getElementById("backLink");


    // ========================================================
    // VALIDATE URL
    // ========================================================

    if (!houseId || !roomId) {

        roomContainer.innerHTML = `
            <h1 class="error">
                Invalid room link.
            </h1>
        `;

        messagesContainer.innerHTML = "";

        messageInput.disabled = true;
        sendButton.disabled = true;

    } else {

        backLink.href =
            `/house.html?id=${encodeURIComponent(houseId)}`;

    }


    // ========================================================
    // ESCAPE HTML
    // ========================================================

    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ========================================================
    // LOAD ROOM
    // ========================================================

    async function loadRoom() {

        if (!houseId || !roomId) return;

        try {

            const response =
                await fetch(
                    `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}`
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Failed to load room."
                );

            }

            const room =
                data.room || data;

            const isBedroom =
                room.room_type === "bedroom";


            roomContainer.innerHTML = `

                <h1>

                    ${
                        isBedroom
                            ? "🛏️"
                            : "🚪"
                    }

                    ${escapeHtml(
                        room.name ||
                        "Room"
                    )}

                </h1>

                <p
                    class="${
                        isBedroom
                            ? "private"
                            : "public"
                    }"
                >

                    ${
                        isBedroom
                            ? "🔒 Private bedroom"
                            : "🌎 Public room"
                    }

                </p>

                ${
                    isBedroom &&
                    data.bedroomOwner
                        ? `
                            <p>
                                Bedroom owner:
                                <strong>
                                    ${escapeHtml(
                                        data.bedroomOwner.display_name ||
                                        data.bedroomOwner.username ||
                                        "Unknown"
                                    )}
                                </strong>
                            </p>
                        `
                        : ""
                }

            `;

        } catch (error) {

            console.error(
                "Load room error:",
                error
            );

            roomContainer.innerHTML = `
                <h1 class="error">
                    ${escapeHtml(
                        error.message
                    )}
                </h1>
            `;

            messageInput.disabled = true;
            sendButton.disabled = true;
        }

    }


    // ========================================================
    // LOAD MESSAGES
    // ========================================================

    async function loadMessages() {

        if (!houseId || !roomId) return;

        try {

            const response =
                await fetch(
                    `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}/messages`
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Failed to load messages."
                );

            }

            const messages =
                Array.isArray(data)
                    ? data
                    : data.messages || [];


            if (!messages.length) {

                messagesContainer.innerHTML = `
                    <div class="empty">
                        No messages yet. Be the first to say something!
                    </div>
                `;

                return;
            }


            messagesContainer.innerHTML =
                messages.map(message => {

                    // IMPORTANT:
                    // The API returns the profile as
                    // message.profile

                    const profile =
                        message.profile || {};

                    const displayName =
                        profile.display_name ||
                        profile.username ||
                        message.username ||
                        message.display_name ||
                        "Unknown";

                    const avatar =
                        profile.avatar_url ||
                        "";

                    return `

                        <div class="message">

                            <div class="message-header">

                                ${
                                    avatar
                                        ? `
                                            <img
                                                class="avatar"
                                                src="${escapeHtml(
                                                    avatar
                                                )}"
                                                alt=""
                                            >
                                        `
                                        : `
                                            <div class="avatar-placeholder">
                                                👤
                                            </div>
                                        `
                                }

                                <span class="username">

                                    ${escapeHtml(
                                        displayName
                                    )}

                                </span>

                            </div>

                            <div>
                                ${escapeHtml(
                                    message.message
                                )}
                            </div>

                            <div class="time">

                                ${escapeHtml(
                                    new Date(
                                        message.created_at
                                    ).toLocaleString()
                                )}

                            </div>

                        </div>

                    `;

                }).join("");


            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        } catch (error) {

            console.error(
                "Load messages error:",
                error
            );

            messagesContainer.innerHTML = `
                <div class="error">
                    ${escapeHtml(
                        error.message
                    )}
                </div>
            `;

        }

    }


    // ========================================================
    // SEND MESSAGE
    // ========================================================

    async function sendMessage() {

        const message =
            messageInput.value.trim();

        if (!message) {
            return;
        }

        errorContainer.textContent = "";

        sendButton.disabled = true;

        try {

            const response =
                await fetch(
                    `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}/messages`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            message
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "Failed to send message."
                );

            }

            messageInput.value = "";

            await loadMessages();

        } catch (error) {

            console.error(
                "Send message error:",
                error
            );

            errorContainer.textContent =
                error.message;

        } finally {

            sendButton.disabled = false;

            messageInput.focus();

        }

    }


    // ========================================================
    // SEND BUTTON
    // ========================================================

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    // ========================================================
    // CTRL + ENTER
    // ========================================================

    messageInput.addEventListener(
        "keydown",
        event => {

            if (
                event.ctrlKey &&
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    // ========================================================
    // INITIAL LOAD
    // ========================================================

    if (houseId && roomId) {

        loadRoom();

        loadMessages();

        setInterval(
            loadMessages,
            3000
        );

    }

</script>

</body>
</html>
