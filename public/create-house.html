<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create a House — ShrekBook</title>

<link rel="stylesheet" href="/styles.css">

<style>
body {
    background:
        radial-gradient(circle at top, rgba(70,255,150,.12), transparent 40%),
        #080b10;
    color: white;
    font-family: Arial, sans-serif;
}

.create-page {
    max-width: 1000px;
    margin: auto;
    padding: 35px 20px 80px;
}

.create-card {
    background: rgba(15,20,28,.94);
    border: 1px solid rgba(120,255,180,.18);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 20px 80px rgba(0,0,0,.35);
}

.create-card h1 {
    font-size: 48px;
    margin-top: 0;
}

.subtitle {
    color: #9aa7b5;
}

.type-grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(190px, 1fr));
    gap: 14px;
    margin: 25px 0;
}

.type-card {
    padding: 20px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.025);
    cursor: pointer;
    transition: .2s;
}

.type-card:hover {
    transform: translateY(-3px);
    border-color: rgba(100,255,170,.3);
}

.type-card.selected {
    border-color: #62ff9e;
    background: rgba(70,255,150,.08);
    box-shadow: 0 0 25px rgba(70,255,150,.1);
}

.type-card h3 {
    margin: 0 0 8px;
}

.type-price {
    font-size: 20px;
    font-weight: bold;
}

.type-info {
    color: #8995a3;
    font-size: 14px;
    margin-top: 10px;
    line-height: 1.6;
}

.field {
    margin-top: 20px;
}

.field label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.field input,
.field textarea {
    width: 100%;
    padding: 14px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,.1);
    background: #0b1017;
    color: white;
    outline: none;
    font: inherit;
}

.field textarea {
    min-height: 130px;
    resize: vertical;
}

.balance {
    margin: 20px 0;
    padding: 15px;
    border-radius: 15px;
    background: rgba(255,255,255,.035);
}

.preview {
    margin-top: 25px;
    padding: 20px;
    border-radius: 18px;
    background: rgba(100,255,170,.05);
    border: 1px solid rgba(100,255,170,.15);
}

.create-button {
    margin-top: 25px;
    width: 100%;
    border: 0;
    padding: 17px;
    border-radius: 15px;
    background: linear-gradient(135deg,#39e47c,#159a53);
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.create-button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.status {
    margin-top: 15px;
    text-align: center;
    min-height: 24px;
}
</style>

</head>

<body>

<nav class="shrekbook-nav">
    <a href="/">Home</a>
    <a href="/profile.html">Profile</a>
    <a href="/houses.html">🏠 Houses</a>
</nav>

<main class="create-page">

<div class="create-card">

    <h1>🏗️ Build a House</h1>

    <p class="subtitle">
        Choose a House Type. Better Houses cost more,
        contain more rooms, and reduce your marketplace tax.
    </p>

    <div id="balance" class="balance">
        💰 Loading ShrekCoins...
    </div>

    <div class="field">

        <label for="name">
            House Name
        </label>

        <input
            id="name"
            maxlength="80"
            placeholder="The Shrek Mansion"
        >

    </div>

    <div class="field">

        <label for="description">
            Description
        </label>

        <textarea
            id="description"
            maxlength="1000"
            placeholder="Tell everyone what this House is about..."
        ></textarea>

    </div>

    <h2>Choose your House Type</h2>

    <div
        id="types"
        class="type-grid"
    >
        Loading...
    </div>

    <div id="preview"></div>

    <button
        id="create"
        class="create-button"
        disabled
    >
        🏗️ Create House
    </button>

    <div
        id="status"
        class="status"
    ></div>

</div>

</main>

<script>
let houseTypes = [];
let selectedType = null;
let currentBalance = 0;


async function loadData() {

    try {

        const [typesResponse, meResponse] =
            await Promise.all([
                fetch("/api/houses/types", {
                    credentials: "include"
                }),
                fetch("/api/me", {
                    credentials: "include"
                })
            ]);


        const typeData =
            await typesResponse.json();

        const meData =
            await meResponse.json();


        if (!typesResponse.ok) {
            throw new Error(
                typeData.error ||
                "Failed to load House Types."
            );
        }


        houseTypes =
            Array.isArray(typeData.houseTypes)
                ? typeData.houseTypes
                : Array.isArray(typeData)
                    ? typeData
                    : [];


        const user =
            meData.user ||
            meData.profile ||
            meData;


        currentBalance =
            Number(
                user?.shrekcoins ??
                user?.shrekCoins ??
                0
            );


        renderBalance();
        renderTypes();

    } catch (error) {

        document.getElementById("status")
            .textContent =
                "😭 " + error.message;
    }
}


function renderBalance() {

    document.getElementById("balance")
        .textContent =
            `💰 Your ShrekCoins: ${currentBalance.toLocaleString()}`;
}


function renderTypes() {

    const container =
        document.getElementById("types");

    if (!houseTypes.length) {

        container.innerHTML =
            "No House Types are available.";

        return;
    }


    container.innerHTML =
        houseTypes.map(type => {

            const reduction =
                Number(type.tax_reduction || 0) * 100;

            return `
                <div
                    class="type-card"
                    data-id="${type.id}"
                    onclick="selectType(${type.id})"
                >

                    <h3>
                        ${escapeHtml(type.name)}
                    </h3>

                    <div class="type-price">
                        💰 ${Number(type.cost).toLocaleString()}
                    </div>

                    <div class="type-info">

                        🚪 ${type.room_count} rooms<br>

                        📉 ${reduction.toFixed(1)}%
                        marketplace tax reduction

                    </div>

                </div>
            `;

        }).join("");
}


function selectType(id) {

    selectedType =
        houseTypes.find(
            type => Number(type.id) === Number(id)
        );

    document
        .querySelectorAll(".type-card")
        .forEach(card => {

            card.classList.toggle(
                "selected",
                Number(card.dataset.id) === Number(id)
            );

        });

    renderPreview();
}


function renderPreview() {

    const preview =
        document.getElementById("preview");

    if (!selectedType) {

        preview.innerHTML = "";

        document.getElementById("create")
            .disabled = true;

        return;
    }


    const reduction =
        Number(selectedType.tax_reduction || 0) * 100;

    const affordable =
        currentBalance >=
        Number(selectedType.cost);


    preview.innerHTML = `
        <div class="preview">

            <h3>
                ${escapeHtml(selectedType.name)}
            </h3>

            <p>
                Cost:
                <strong>
                    ${Number(selectedType.cost).toLocaleString()}
                    ShrekCoins
                </strong>
            </p>

            <p>
                Rooms:
                <strong>
                    ${selectedType.room_count}
                </strong>
            </p>

            <p>
                Marketplace tax reduction:
                <strong>
                    ${reduction.toFixed(1)}%
                </strong>
            </p>

            <p>
                ${
                    affordable
                        ? "✅ You can afford this House."
                        : "❌ You cannot afford this House."
                }
            </p>

        </div>
    `;


    document.getElementById("create")
        .disabled = !affordable;
}


async function createHouse() {

    const name =
        document.getElementById("name")
            .value.trim();

    const description =
        document.getElementById("description")
            .value.trim();

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("create");


    if (!name) {

        status.textContent =
            "Please enter a House name.";

        return;
    }

    if (!selectedType) {

        status.textContent =
            "Choose a House Type first.";

        return;
    }


    button.disabled = true;

    status.textContent =
        "🏗️ Building your House...";


    try {

        const response =
            await fetch("/api/houses", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    name,
                    description,
                    houseTypeId:
                        selectedType.id
                })
            });


        const data =
            await response.json();


        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to create House."
            );
        }


        status.textContent =
            "🎉 House created!";


        window.location.href =
            `/house.html?id=${encodeURIComponent(
                data.house.id
            )}`;

    } catch (error) {

        status.textContent =
            "😭 " + error.message;

        button.disabled = false;
    }
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


document
    .getElementById("create")
    .addEventListener(
        "click",
        createHouse
    );


loadData();
</script>

</body>
</html>
