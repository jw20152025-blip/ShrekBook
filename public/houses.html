<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Houses - ShrekBook</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: white;
            border-bottom: 1px solid #ddd;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #4b8f29;
        }

        .create-button {
            background: #4b8f29;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            margin: 20px 0;
        }

        .houses {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));
            gap: 18px;
        }

        .house {
            background: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
        }

        .house h2 {
            margin-top: 0;
        }

        .description {
            color: #666;
            margin-bottom: 15px;
        }

        .info {
            line-height: 1.8;
            font-size: 14px;
        }

        .enter {
            display: block;
            text-align: center;
            background: #4b8f29;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 7px;
            margin-top: 15px;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">🏠 ShrekBook Houses</div>

    <a href="create-house.html" class="create-button">
        + Create House
    </a>
</header>

<main>

    <h1>Houses</h1>

    <p>
        Explore the Houses of ShrekBook.
    </p>

    <input
        id="search"
        class="search"
        type="text"
        placeholder="Search Houses..."
    >

    <div id="houses" class="houses">
        <div class="message">
            Loading Houses...
        </div>
    </div>

</main>

<script>
    const container = document.getElementById("houses");
    const search = document.getElementById("search");

    let houses = [];

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    async function loadHouses() {
        try {
            const response = await fetch("/api/houses");

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Failed to load Houses.");
            }

            houses = Array.isArray(data) ? data : data.houses || [];

            render();

        } catch (error) {
            console.error(error);

            container.innerHTML = `
                <div class="message">
                    <h2>Couldn't load Houses 😭</h2>
                    <p>${escapeHtml(error.message)}</p>
                </div>
            `;
        }
    }

    function render() {
        const query = search.value.trim().toLowerCase();

        const filtered = houses.filter(house => {
            return (
                String(house.name || "")
                    .toLowerCase()
                    .includes(query)
                ||
                String(house.description || "")
                    .toLowerCase()
                    .includes(query)
                ||
                String(house.house_type || "")
                    .toLowerCase()
                    .includes(query)
            );
        });

        if (!filtered.length) {
            container.innerHTML = `
                <div class="message">
                    <h2>No Houses Found</h2>
                </div>
            `;

            return;
        }

        container.innerHTML = filtered.map(house => {

            const tax =
                house.tax_reduction != null
                    ? (Number(house.tax_reduction) * 100).toFixed(2) + "%"
                    : "N/A";

            return `
                <div class="house">

                    <h2>
                        🏠 ${escapeHtml(house.name)}
                    </h2>

                    <div class="description">
                        ${escapeHtml(
                            house.description || "No description."
                        )}
                    </div>

                    <div class="info">

                        👑 Owner:
                        <strong>
                            ${escapeHtml(
                                house.owner_username || "Unknown"
                            )}
                        </strong>

                        <br>

                        🏘️ Type:
                        <strong>
                            ${escapeHtml(house.house_type)}
                        </strong>

                        <br>

                        🚪 Rooms:
                        <strong>
                            ${escapeHtml(house.room_count)}
                        </strong>

                        <br>

                        🛒 Tax reduction:
                        <strong>
                            ${escapeHtml(tax)}
                        </strong>

                    </div>

                    <a
                        class="enter"
                        href="house.html?id=${encodeURIComponent(house.id)}"
                    >
                        Enter House →
                    </a>

                </div>
            `;

        }).join("");
    }

    search.addEventListener("input", render);

    loadHouses();
</script>

</body>
</html>
