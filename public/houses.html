<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Houses — ShrekBook</title>

<link rel="stylesheet" href="/styles.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, rgba(120,255,180,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(80,160,255,.10), transparent 35%),
        #080b10;
    color: #fff;
    font-family: Arial, sans-serif;
}

.house-page {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px 80px;
}

.house-hero {
    padding: 45px 30px;
    border-radius: 28px;
    background:
        linear-gradient(135deg, rgba(20,30,40,.95), rgba(10,15,22,.92));
    border: 1px solid rgba(120,255,180,.25);
    box-shadow:
        0 0 45px rgba(50,255,150,.08),
        inset 0 0 30px rgba(255,255,255,.02);
    margin-bottom: 25px;
}

.house-hero h1 {
    margin: 0;
    font-size: clamp(36px, 6vw, 64px);
}

.house-hero p {
    color: #aab5c2;
    font-size: 18px;
    max-width: 700px;
}

.house-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.house-button {
    border: 0;
    border-radius: 14px;
    padding: 13px 18px;
    background: #142019;
    color: #fff;
    text-decoration: none;
    cursor: pointer;
    font-weight: bold;
    border: 1px solid rgba(120,255,180,.25);
    transition: .2s;
}

.house-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 22px rgba(100,255,170,.18);
}

.house-button.primary {
    background: linear-gradient(135deg, #35d879, #1b9e57);
}

.house-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
}

.house-card {
    border-radius: 22px;
    padding: 22px;
    background: rgba(15,20,28,.92);
    border: 1px solid rgba(255,255,255,.08);
    transition: .2s;
}

.house-card:hover {
    transform: translateY(-4px);
    border-color: rgba(100,255,170,.35);
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
}

.house-card h2 {
    margin-top: 0;
}

.house-type {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    background: rgba(100,255,170,.1);
    color: #7dffb1;
    font-size: 13px;
    font-weight: bold;
}

.house-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin: 18px 0;
}

.house-stat {
    background: rgba(255,255,255,.035);
    border-radius: 12px;
    padding: 11px;
}

.house-stat small {
    display: block;
    color: #8995a3;
}

.loading,
.empty,
.error {
    text-align: center;
    padding: 50px 20px;
    color: #9ba7b5;
}

.error {
    color: #ff7f8c;
}

.tax-good {
    color: #7dffb1;
}
</style>
</head>

<body>

<nav class="shrekbook-nav">
    <a href="/">Home</a>
    <a href="/profile.html">Profile</a>
    <a href="/shrekchat.html">💬 ShrekChat</a>
    <a href="/shreksearch.html">🔎 ShrekSearch</a>
    <a href="/houses.html">🏠 Houses</a>
</nav>

<main class="house-page">

<section class="house-hero">

    <h1>🏠 Houses</h1>

    <p>
        Build your own place on ShrekBook, join other Houses,
        hang out in rooms, and create your own little corner
        of the internet.
    </p>

    <div class="house-actions">
        <a class="house-button primary" href="/create-house.html">
            🏗️ Create a House
        </a>

        <button class="house-button" onclick="loadHouses()">
            🔄 Refresh
        </button>
    </div>

</section>

<section id="house-list">

    <div class="loading">
        Loading Houses...
    </div>

</section>

</main>

<script>
async function loadHouses() {

    const container =
        document.getElementById("house-list");

    container.innerHTML =
        `<div class="loading">🏠 Loading Houses...</div>`;

    try {

        const response =
            await fetch("/api/houses", {
                credentials: "include"
            });

        const raw = await response.text();

        let data;

        try {
            data = JSON.parse(raw);
        } catch {
            throw new Error(
                "Server returned invalid JSON."
            );
        }

        if (!response.ok) {
            throw new Error(
                data.error ||
                "Failed to load Houses."
            );
        }


        // Accept all reasonable response shapes.

        const houses =
            Array.isArray(data)
                ? data
                : Array.isArray(data.houses)
                    ? data.houses
                    : Array.isArray(data.data)
                        ? data.data
                        : null;

        if (!houses) {
            console.error("Invalid House response:", data);

            throw new Error(
                "Invalid House response."
            );
        }


        if (!houses.length) {

            container.innerHTML = `
                <div class="empty">
                    <div style="font-size:50px">🏚️</div>
                    <h2>No Houses yet</h2>
                    <p>Be the first person to build one!</p>
                </div>
            `;

            return;
        }


        container.innerHTML = `
            <div class="house-grid">

                ${houses.map(house => {

                    const type =
                        house.houseType ||
                        house.house_type ||
                        {};

                    const owner =
                        house.owner ||
                        {};

                    const taxReduction =
                        Number(type.tax_reduction || 0) * 100;

                    return `
                        <article class="house-card">

                            <span class="house-type">
                                ${escapeHtml(
                                    type.name ||
                                    house.house_type ||
                                    "House"
                                )}
                            </span>

                            <h2>
                                ${escapeHtml(
                                    house.name ||
                                    "Unnamed House"
                                )}
                            </h2>

                            <p>
                                ${escapeHtml(
                                    house.description ||
                                    "No description."
                                )}
                            </p>

                            <div class="house-meta">

                                <div class="house-stat">
                                    <small>Owner</small>
                                    👤 ${
                                        escapeHtml(
                                            owner.display_name ||
                                            owner.username ||
                                            "Unknown"
                                        )
                                    }
                                </div>

                                <div class="house-stat">
                                    <small>Rooms</small>
                                    🚪 ${
                                        house.roomCount ??
                                        type.room_count ??
                                        0
                                    }
                                </div>

                                <div class="house-stat">
                                    <small>Members</small>
                                    👥 ${
                                        house.memberCount ??
                                        0
                                    }
                                </div>

                                <div class="house-stat">
                                    <small>Marketplace Tax</small>
                                    <span class="tax-good">
                                        -${taxReduction.toFixed(1)}%
                                    </span>
                                </div>

                            </div>

                            <a
                                class="house-button"
                                href="/house.html?id=${encodeURIComponent(house.id)}"
                            >
                                Enter House →
                            </a>

                        </article>
                    `;

                }).join("")}

            </div>
        `;

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error">

                <div style="font-size:50px">😭</div>

                <h2>Couldn't load Houses</h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

                <button
                    class="house-button"
                    onclick="loadHouses()"
                >
                    Try Again
                </button>

            </div>
        `;
    }
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


loadHouses();
</script>

</body>
</html>
