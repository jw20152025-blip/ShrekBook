<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>House Room — ShrekBook</title>

<link rel="stylesheet" href="/styles.css">

<style>
body {
    margin: 0;
    background:
        radial-gradient(circle at top right, rgba(90,255,170,.08), transparent 35%),
        #080b10;
    color: white;
    font-family: Arial, sans-serif;
}

.room-page {
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px 70px;
}

.room-header {
    padding: 30px;
    border-radius: 25px;
    background: rgba(15,20,28,.95);
    border: 1px solid rgba(100,255,170,.2);
    margin-bottom: 20px;
}

.room-header h1 {
    margin: 0;
    font-size: 40px;
}

.room-sub {
    color: #8f9ba8;
}

.room-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.badge {
    padding: 7px 11px;
    border-radius: 999px;
    background: rgba(255,255,255,.06);
    font-size: 13px;
}

.tax {
    color: #7dffb1;
}

.chat {
    min-height: 500px;
    padding: 20px;
    border-radius: 25px;
    background: rgba(12,17,24,.96);
    border: 1px solid rgba(255,255,255,.07);
}

.messages {
    min-height: 390px;
    max-height: 600px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.message {
    display: flex;
    gap: 10px;
}

.message-avatar {
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    border-radius: 50%;
    object-fit: cover;
    background: #18202a;
}

.message-bubble {
    max-width: 75%;
    padding: 11px 14px;
    border-radius: 15px;
    background: rgba(255,255,255,.05);
}

.message-name {
    font-size: 13px;
    font-weight: bold;
    color: #7dffb1;
}

.message-text {
    margin-top: 4px;
    white-space: pre-wrap;
    word-break: break-word;
}

.message-time {
    margin-top: 4px;
    font-size: 11px;
    color: #66727e;
}

.composer {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.composer textarea {
    flex: 1;
    resize: none;
    min-height: 55px;
    padding: 13px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,.1);
    background: #090e14;
    color: white;
    font: inherit;
}

.button {
    border: 0;
    border-radius: 13px;
    padding: 12px 17px;
    background: #17241c;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.button.primary {
    background: linear-gradient(135deg,#39dd7b,#159952);
}

.notice {
    padding: 40px;
    text-align: center;
    color: #8e99a5;
}
</style>

</head>

<body>

<nav class="shrekbook-nav">

<a href="/">Home</a>
<a href="/houses.html">🏠 Houses</a>

</nav>


<main class="room-page">

<div id="page">

<div class="notice">
🚪 Loading room...
</div>

</div>

</main>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const houseId =
    params.get("house");

const roomId =
    params.get("room");


let roomData = null;


if (!houseId || !roomId) {

    showError(
        "Missing House or Room ID."
    );

} else {

    loadRoom();
}


async function loadRoom() {

    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}`,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load room."
            );
        }


        roomData = data;


        renderRoom();

        await loadMessages();

        startPolling();

    } catch (error) {

        showError(
            error.message
        );
    }
}


function renderRoom() {

    const page =
        document.getElementById("page");

    const house =
        roomData.house || {};

    const room =
        roomData.room || {};

    const houseType =
        roomData.houseType || null;

    const bedroomOwner =
        roomData.bedroomOwner || null;


    const taxReduction =
        houseType
            ? Number(
                houseType.tax_reduction || 0
              ) * 100
            : 0;


    page.innerHTML = `

        <section class="room-header">

            <a
                href="/house.html?id=${encodeURIComponent(house.id)}"
                class="button"
            >
                ← Back to House
            </a>

            <h1>
                ${
                    room.room_type === "bedroom"
                        ? "🛏️"
                        : "🛋️"
                }

                ${escapeHtml(
                    room.name ||
                    "Room"
                )}
            </h1>

            <div class="room-sub">

                🏠
                ${escapeHtml(
                    house.name ||
                    "House"
                )}

            </div>


            <div class="room-badges">

                <span class="badge">

                    ${
                        room.room_type === "bedroom"
                            ? "🔒 Private Bedroom"
                            : "🌐 Public Room"
                    }

                </span>


                ${
                    houseType
                        ? `
                            <span class="badge">
                                🏠 ${escapeHtml(
                                    houseType.name
                                )}
                            </span>
                        `
                        : ""
                }


                <span class="badge tax">

                    📉 Marketplace Tax:
                    ${
                        taxReduction
                            ? `-${taxReduction.toFixed(1)}%`
                            : "0.0%"
                    }

                </span>


                ${
                    bedroomOwner
                        ? `
                            <span class="badge">
                                👤 Bedroom of
                                ${escapeHtml(
                                    bedroomOwner.display_name ||
                                    bedroomOwner.username
                                )}
                            </span>
                        `
                        : ""
                }

            </div>

        </section>


        <section class="chat">

            <div
                id="messages"
                class="messages"
            >
                <div class="notice">
                    Loading messages...
                </div>
            </div>


            <div class="composer">

                <textarea
                    id="message"
                    maxlength="2000"
                    placeholder="Say something..."
                ></textarea>

                <button
                    class="button primary"
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>

        </section>

    `;


    document
        .getElementById("message")
        .addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Enter" &&
                    event.ctrlKey
                ) {
                    sendMessage();
                }

            }
        );
}


async function loadMessages() {

    const container =
        document.getElementById(
            "messages"
        );

    if (!container) return;


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}/messages`,
                {
                    credentials: "include"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load messages."
            );
        }


        const messages =
            Array.isArray(data.messages)
                ? data.messages
                : [];


        if (!messages.length) {

            container.innerHTML = `
                <div class="notice">
                    💬 No messages yet.
                    Start the conversation!
                </div>
            `;

            return;
        }


        container.innerHTML =
            messages.map(renderMessage)
                .join("");


        container.scrollTop =
            container.scrollHeight;

    } catch (error) {

        container.innerHTML = `
            <div class="notice">
                😭 ${escapeHtml(
                    error.message
                )}
            </div>
        `;
    }
}


function renderMessage(message) {

    const profile =
        message.profile || {};

    const avatar =
        profile.avatar_url
            ? `
                <img
                    class="message-avatar"
                    src="${escapeHtml(
                        profile.avatar_url
                    )}"
                >
            `
            : `
                <div
                    class="message-avatar"
                    style="
                        display:grid;
                        place-items:center;
                    "
                >
                    👤
                </div>
            `;


    const time =
        message.created_at
            ? new Date(
                message.created_at
            ).toLocaleString()
            : "";


    return `

        <div class="message">

            ${avatar}

            <div class="message-bubble">

                <div class="message-name">

                    ${escapeHtml(
                        profile.display_name ||
                        profile.username ||
                        "Unknown"
                    )}

                    ${
                        profile.username
                            ? `
                                <span
                                    style="
                                        color:#66727e;
                                        font-weight:normal;
                                    "
                                >
                                    @${escapeHtml(
                                        profile.username
                                    )}
                                </span>
                            `
                            : ""
                    }

                </div>

                <div class="message-text">
                    ${escapeHtml(
                        message.message
                    )}
                </div>

                <div class="message-time">
                    ${escapeHtml(time)}
                </div>

            </div>

        </div>

    `;
}


async function sendMessage() {

    const input =
        document.getElementById(
            "message"
        );

    const message =
        input.value.trim();

    if (!message) return;


    input.disabled = true;


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/rooms/${encodeURIComponent(roomId)}/messages`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        message
                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to send message."
            );
        }


        input.value = "";

        await loadMessages();

    } catch (error) {

        alert(
            "😭 " + error.message
        );

    } finally {

        input.disabled = false;

        input.focus();
    }
}


let pollTimer = null;


function startPolling() {

    if (pollTimer) {
        clearInterval(pollTimer);
    }

    pollTimer =
        setInterval(
            loadMessages,
            3000
        );
}


function showError(message) {

    document.getElementById("page")
        .innerHTML = `

            <div class="notice">

                <div style="font-size:55px">
                    😭
                </div>

                <h2>
                    Couldn't load room
                </h2>

                <p>
                    ${escapeHtml(message)}
                </p>

                <a
                    class="button"
                    href="/houses.html"
                >
                    ← Houses
                </a>

            </div>

        `;
}


function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

</script>

</body>
</html>
