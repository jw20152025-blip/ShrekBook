<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>ShrekBook Admin 🛡️</title>

<link
    rel="stylesheet"
    href="/styles.css">

</head>

<body>

<header class="navbar">

    <div class="navbar-inner">

        <a
            href="/"
            class="logo">

            🧌 ShrekBook

        </a>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/profile.html">
                Profile
            </a>

            <a href="/shrekchat.html">
                💬 ShrekChat
            </a>

            <a href="/admin.html">
                🛡️ Admin
            </a>

            <button
                onclick="logout()">

                Logout

            </button>

        </nav>

    </div>

</header>


<main class="container">

    <section>

        <h1>
            🛡️ ShrekBook Admin Panel
        </h1>

        <p id="admin-status">
            Checking admin access...
        </p>

    </section>


    <section
        id="admin-panel"
        style="display:none;">

        <h2>
            👥 User Management
        </h2>

        <button
            onclick="loadAdminUsers()">

            🔄 Refresh Users

        </button>

        <div
            id="admin-users"
            style="margin-top:20px;">

            Loading users...

        </div>

    </section>

</main>


<script>

console.log(
    "🛡️ ShrekBook admin loaded"
);


// ========================================================
// API
// ========================================================

async function api(
    url,
    options = {}
) {

    const response =
        await fetch(
            url,
            {
                credentials:
                    "same-origin",

                ...options,

                headers: {
                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );

    let data = {};

    try {

        data =
            await response.json();

    } catch {

        data = {};

    }

    if (!response.ok) {

        throw new Error(
            data.error ||
            `Request failed (${response.status})`
        );

    }

    return data;
}


// ========================================================
// INITIALIZE
// ========================================================

async function initializeAdmin() {

    const status =
        document.getElementById(
            "admin-status"
        );

    try {

        const data =
            await api(
                "/api/admin/me"
            );

        if (
            !data.isAdmin
        ) {

            throw new Error(
                "You are not an administrator."
            );

        }

        status.textContent =
            "🟢 Admin access confirmed.";

        document.getElementById(
            "admin-panel"
        ).style.display =
            "block";

        await loadAdminUsers();

    } catch (error) {

        console.error(
            "ADMIN INIT ERROR:",
            error
        );

        status.textContent =
            "❌ " +
            error.message;

    }

}


// ========================================================
// LOAD USERS
// ========================================================

async function loadAdminUsers() {

    const container =
        document.getElementById(
            "admin-users"
        );

    container.innerHTML =
        "Loading users...";

    try {

        const data =
            await api(
                "/api/admin/users"
            );

        const users =
            data.users || [];

        if (
            users.length === 0
        ) {

            container.innerHTML =
                "<p>No users found.</p>";

            return;

        }

        container.innerHTML =
            "";

        for (
            const user
            of users
        ) {

            const card =
                document.createElement(
                    "div"
                );

            card.style.border =
                "1px solid #ccc";

            card.style.padding =
                "15px";

            card.style.marginBottom =
                "10px";

            card.style.borderRadius =
                "10px";

            const name =
                escapeHTML(
                    user.display_name ||
                    user.username ||
                    "Unknown"
                );

            const username =
                escapeHTML(
                    user.username ||
                    ""
                );

            let status =
                "🟢 Active";

            if (
                user.is_revoked
            ) {

                status =
                    "🚫 REVOKED";

            } else if (
                user.kick_until &&
                new Date(
                    user.kick_until
                ) > new Date()
            ) {

                status =
                    "👢 KICKED";

            }

            card.innerHTML = `

                <strong>
                    ${name}
                </strong>

                <br>

                <small>
                    @${username}
                </small>

                <br>

                <small>
                    ID: ${escapeHTML(user.id)}
                </small>

                <br><br>

                <strong>
                    Status:
                </strong>

                ${status}

                <br><br>

                <button
                    onclick="kickUser('${escapeAttribute(user.id)}')">

                    👢 Kick

                </button>

                <button
                    onclick="revokeUser('${escapeAttribute(user.id)}')">

                    🚫 Revoke

                </button>

                <button
                    onclick="unrevokeUser('${escapeAttribute(user.id)}')">

                    ♻️ Restore

                </button>

                <button
                    onclick="deleteUser('${escapeAttribute(user.id)}')">

                    🗑️ Delete

                </button>

            `;

            container.appendChild(
                card
            );

        }

    } catch (error) {

        console.error(
            "LOAD ADMIN USERS ERROR:",
            error
        );

        container.innerHTML =
            `<p>❌ ${escapeHTML(error.message)}</p>`;

    }

}


// ========================================================
// KICK
// ========================================================

async function kickUser(id) {

    const input =
        prompt(
            "How many minutes should the user be kicked?",
            "60"
        );

    if (
        input === null
    ) {
        return;
    }

    const minutes =
        Number(input);

    if (
        !Number.isFinite(minutes) ||
        minutes <= 0
    ) {

        alert(
            "Invalid number of minutes."
        );

        return;

    }

    if (
        !confirm(
            `Kick this user for ${minutes} minutes?`
        )
    ) {

        return;

    }

    try {

        await api(
            `/api/admin/users/${encodeURIComponent(id)}/kick`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({
                        minutes
                    })
            }
        );

        alert(
            "👢 User kicked."
        );

        await loadAdminUsers();

    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================================
// REVOKE
// ========================================================

async function revokeUser(id) {

    if (
        !confirm(
            "REVOKE this account? This will prevent the user from logging in."
        )
    ) {

        return;

    }

    try {

        await api(
            `/api/admin/users/${encodeURIComponent(id)}/revoke`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({})
            }
        );

        alert(
            "🚫 User revoked."
        );

        await loadAdminUsers();

    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================================
// RESTORE
// ========================================================

async function unrevokeUser(id) {

    if (
        !confirm(
            "Restore this account?"
        )
    ) {

        return;

    }

    try {

        await api(
            `/api/admin/users/${encodeURIComponent(id)}/unrevoke`,
            {
                method:
                    "POST",

                body:
                    JSON.stringify({})
            }
        );

        alert(
            "♻️ User restored."
        );

        await loadAdminUsers();

    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================================
// DELETE
// ========================================================

async function deleteUser(id) {

    if (
        !confirm(
            "DELETE this user permanently? This cannot be undone."
        )
    ) {

        return;

    }

    try {

        await api(
            `/api/admin/users/${encodeURIComponent(id)}`,
            {
                method:
                    "DELETE"
            }
        );

        alert(
            "🗑️ User deleted."
        );

        await loadAdminUsers();

    } catch (error) {

        alert(
            "❌ " +
            error.message
        );

    }

}


// ========================================================
// LOGOUT
// ========================================================

async function logout() {

    try {

        await api(
            "/api/logout",
            {
                method:
                    "POST"
            }
        );

        window.location.href =
            "/";

    } catch (error) {

        alert(
            error.message
        );

    }

}


// ========================================================
// SECURITY
// ========================================================

function escapeHTML(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}

function escapeAttribute(value) {

    return escapeHTML(
        value
    );

}


// ========================================================
// START
// ========================================================

initializeAdmin();

</script>

</body>

</html>
