body {

```html
<script>

const params = new URLSearchParams(location.search);
const houseId = params.get("id");

const content = document.getElementById("content");


if (!houseId) {

    content.innerHTML = `
        <div class="notice">
            <div style="font-size:55px;">😭</div>
            <h2>No House ID was provided.</h2>
            <a class="button primary" href="/houses.html">
                ← Back to Houses
            </a>
        </div>
    `;

} else {

    loadHouse();

}


/* =========================================================
   LOAD HOUSE
========================================================= */

async function loadHouse() {

    content.innerHTML = `
        <div class="notice">
            <div style="font-size:55px;">🏠</div>
            <h2>Loading House...</h2>
        </div>
    `;

    try {

        const response = await fetch(
            `/api/houses/${encodeURIComponent(houseId)}`,
            {
                credentials: "include",
                headers: {
                    "Accept": "application/json"
                }
            }
        );


        const raw = await response.text();

        let data;

        try {

            data = JSON.parse(raw);

        } catch (error) {

            console.error(
                "House API returned non-JSON:",
                raw
            );

            throw new Error(
                "The House server returned invalid data."
            );
        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to load House."
            );

        }


        /*
            EXPECTED RESPONSE:

            {
                house,
                houseType,
                owner,
                rooms,
                members,
                membership,
                canManage,
                canInvite
            }
        */


        const house = data.house;

        if (!house || !house.id) {

            console.error(
                "Invalid House response:",
                data
            );

            throw new Error(
                "Invalid House response."
            );

        }


        const houseType =
            data.houseType || null;


        const owner =
            data.owner || null;


        const rooms =
            Array.isArray(data.rooms)
                ? data.rooms
                : [];


        const members =
            Array.isArray(data.members)
                ? data.members
                : [];


        const membership =
            data.membership || null;


        const canManage =
            data.canManage === true;


        const canInvite =
            data.canInvite === true;


        /* =====================================================
           TAX
        ===================================================== */

        const taxReduction =
            houseType &&
            houseType.tax_reduction != null
                ? Number(houseType.tax_reduction) * 100
                : 0;


        const marketplaceTax =
            Math.max(
                0,
                12.5 - taxReduction
            );


        /* =====================================================
           OWNER
        ===================================================== */

        const ownerName =
            owner?.display_name ||
            owner?.username ||
            (
                house.owner_id
                    ? "Unknown User"
                    : "No Owner"
            );


        /* =====================================================
           RENDER
        ===================================================== */

        content.innerHTML = `

            <section class="hero">

                <div class="hero-top">

                    <div>

                        <h1>
                            🏠
                            ${escapeHtml(
                                house.name ||
                                "Unnamed House"
                            )}
                        </h1>

                        <div class="type-badge">

                            ${escapeHtml(
                                houseType?.name ||
                                house.house_type ||
                                "House"
                            )}

                        </div>

                    </div>


                    <div>

                        <a
                            class="button"
                            href="/houses.html"
                        >
                            ← Houses
                        </a>

                        ${
                            canManage
                                ? `
                                    <a
                                        class="button"
                                        href="/house-settings.html?id=${encodeURIComponent(house.id)}"
                                    >
                                        ⚙️ Settings
                                    </a>
                                `
                                : ""
                        }

                    </div>

                </div>


                <p class="description">

                    ${escapeHtml(
                        house.description ||
                        "This House has no description."
                    )}

                </p>


                <div class="stats">


                    <div class="stat">

                        <small>Owner</small>

                        👑
                        ${escapeHtml(ownerName)}

                    </div>


                    <div class="stat">

                        <small>House Type</small>

                        🏠
                        ${escapeHtml(
                            houseType?.name ||
                            house.house_type ||
                            "Unknown"
                        )}

                    </div>


                    <div class="stat">

                        <small>Rooms</small>

                        🚪
                        ${rooms.length}

                        ${
                            houseType?.room_count
                                ? `
                                    / ${escapeHtml(
                                        houseType.room_count
                                    )}
                                `
                                : ""
                        }

                    </div>


                    <div class="stat">

                        <small>Members</small>

                        👥
                        ${members.length}

                    </div>


                    <div class="stat">

                        <small>Marketplace Tax</small>

                        <strong
                            style="color:#74ffab"
                        >
                            ${marketplaceTax.toFixed(1)}%
                        </strong>

                        ${
                            taxReduction > 0
                                ? `
                                    <div
                                        style="
                                            color:#75ffac;
                                            font-size:12px;
                                            margin-top:4px;
                                        "
                                    >
                                        -${taxReduction.toFixed(1)}%
                                        House bonus
                                    </div>
                                `
                                : ""
                        }

                    </div>


                </div>

            </section>


            <!-- =================================================
                 ROOMS
            ================================================= -->

            <section class="section">

                <h2>🚪 Rooms</h2>

                <div class="room-grid">

                    ${
                        rooms.length

                        ? rooms.map(room => {

                            const privateRoom =
                                room.room_type === "bedroom";


                            const bedroomOwner =
                                room.bedroomOwner ||
                                null;


                            return `

                                <article
                                    class="room-card"
                                >

                                    <div
                                        class="room-icon"
                                    >
                                        ${
                                            privateRoom
                                                ? "🛏️"
                                                : "🛋️"
                                        }
                                    </div>


                                    <h3>

                                        ${escapeHtml(
                                            room.name ||
                                            "Unnamed Room"
                                        )}

                                    </h3>


                                    <p
                                        class="${
                                            privateRoom
                                                ? "room-private"
                                                : "room-public"
                                        }"
                                    >

                                        ${
                                            privateRoom
                                                ? "🔒 Private Bedroom"
                                                : "🌐 Public Room"
                                        }

                                    </p>


                                    ${
                                        privateRoom
                                        ? `

                                            <p>

                                                👤 Bedroom of

                                                <strong>

                                                    ${escapeHtml(
                                                        bedroomOwner?.display_name ||
                                                        bedroomOwner?.username ||
                                                        "Unknown"
                                                    )}

                                                </strong>

                                            </p>

                                        `
                                        : ""
                                    }


                                    <a
                                        class="button primary"
                                        href="/house-room.html?house=${encodeURIComponent(house.id)}&room=${encodeURIComponent(room.id)}"
                                    >
                                        ${
                                            privateRoom
                                                ? "🔐 Enter Bedroom →"
                                                : "🚪 Enter Room →"
                                        }
                                    </a>

                                </article>

                            `;

                        }).join("")

                        : `

                            <div class="notice">

                                <div
                                    style="
                                        font-size:45px;
                                    "
                                >
                                    🚪
                                </div>

                                <h3>
                                    No rooms found
                                </h3>

                                <p>
                                    This House doesn't have
                                    any rooms yet.
                                </p>

                            </div>

                        `
                    }

                </div>

            </section>


            <!-- =================================================
                 MEMBERS
            ================================================= -->

            <section class="section">

                <h2>
                    👥 Members
                    <span
                        style="
                            color:#7dffb1;
                            font-size:16px;
                        "
                    >
                        ${members.length}
                    </span>
                </h2>


                <div class="member-grid">

                    ${
                        members.length

                        ? members.map(member => {

                            const profile =
                                member.profile || {};


                            const name =
                                profile.display_name ||
                                profile.username ||
                                "Unknown";


                            const username =
                                profile.username ||
                                "unknown";


                            return `

                                <div
                                    class="member-card"
                                >

                                    ${
                                        profile.avatar_url

                                        ? `

                                            <img
                                                class="avatar"
                                                src="${escapeHtml(
                                                    profile.avatar_url
                                                )}"
                                                alt=""
                                            >

                                        `

                                        : `

                                            <div
                                                class="avatar"
                                                style="
                                                    display:grid;
                                                    place-items:center;
                                                    font-size:22px;
                                                "
                                            >
                                                👤
                                            </div>

                                        `
                                    }


                                    <div
                                        class="member-info"
                                    >

                                        <div
                                            class="member-name"
                                        >

                                            ${escapeHtml(
                                                name
                                            )}

                                        </div>


                                        <div
                                            class="member-username"
                                        >

                                            @${escapeHtml(
                                                username
                                            )}

                                        </div>

                                    </div>


                                    <div
                                        class="role"
                                    >

                                        ${
                                            member.role === "owner"
                                                ? "👑 Owner"
                                                : member.role === "admin"
                                                    ? "🛡️ Admin"
                                                    : "Member"
                                        }

                                    </div>

                                </div>

                            `;

                        }).join("")

                        : `

                            <div class="notice">

                                No members found.

                            </div>

                        `
                    }

                </div>

            </section>


            <!-- =================================================
                 INVITES
            ================================================= -->

            ${
                canInvite

                ? `

                    <section
                        class="section"
                    >

                        <h2>
                            📨 Invite Someone
                        </h2>


                        <div
                            class="invite-box"
                        >

                            <div
                                class="invite-search"
                            >

                                <input
                                    id="user-search"
                                    placeholder="Search ShrekBook users..."
                                    autocomplete="off"
                                >


                                <button
                                    class="button primary"
                                    id="search-users-button"
                                    type="button"
                                >
                                    🔎 Search
                                </button>

                            </div>


                            <div
                                id="search-results"
                                class="search-results"
                            ></div>

                        </div>

                    </section>

                `

                : ""
            }

        `;


        /* =====================================================
           USER SEARCH
        ===================================================== */

        if (canInvite) {

            const search =
                document.getElementById(
                    "user-search"
                );


            const searchButton =
                document.getElementById(
                    "search-users-button"
                );


            if (search) {

                search.addEventListener(
                    "keydown",
                    event => {

                        if (
                            event.key === "Enter"
                        ) {

                            searchUsers();

                        }

                    }
                );

            }


            if (searchButton) {

                searchButton.addEventListener(
                    "click",
                    searchUsers
                );

            }

        }


    } catch (error) {

        console.error(
            "loadHouse error:",
            error
        );


        content.innerHTML = `

            <div class="notice">

                <div
                    style="
                        font-size:60px;
                    "
                >
                    😭
                </div>


                <h2>
                    Couldn't load House
                </h2>


                <p>
                    ${escapeHtml(
                        error.message
                    )}
                </p>


                <button
                    class="button primary"
                    onclick="loadHouse()"
                >
                    🔄 Try Again
                </button>

            </div>

        `;

    }

}


/* =========================================================
   SEARCH USERS
========================================================= */

async function searchUsers() {

    const input =
        document.getElementById(
            "user-search"
        );


    const results =
        document.getElementById(
            "search-results"
        );


    if (!input || !results) {
        return;
    }


    const query =
        input.value.trim();


    if (!query) {

        results.innerHTML = `
            <p>
                🔎 Type something to search.
            </p>
        `;

        return;
    }


    results.innerHTML = `
        <p>
            🔎 Searching ShrekBook...
        </p>
    `;


    try {

        const response =
            await fetch(
                `/api/users/search?q=${encodeURIComponent(query)}`,
                {
                    credentials: "include",
                    headers: {
                        "Accept": "application/json"
                    }
                }
            );


        const raw =
            await response.text();


        let data;


        try {

            data = JSON.parse(raw);

        } catch {

            throw new Error(
                "User search returned invalid data."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Search failed."
            );

        }


        const users =
            Array.isArray(data.users)
                ? data.users
                : [];


        if (!users.length) {

            results.innerHTML = `
                <p>
                    😭 No users found.
                </p>
            `;

            return;

        }


        results.innerHTML =
            users.map(user => {

                const userId =
                    String(user.id || "");


                return `

                    <div
                        class="search-user"
                        data-user-id="${escapeHtml(
                            userId
                        )}"
                    >

                        👤

                        <strong>
                            ${escapeHtml(
                                user.display_name ||
                                user.username ||
                                "Unknown"
                            )}
                        </strong>

                        <span
                            style="
                                color:#8995a3;
                            "
                        >
                            @${escapeHtml(
                                user.username ||
                                "unknown"
                            )}
                        </span>


                        <span
                            style="
                                float:right;
                                color:#75ffac;
                                font-weight:bold;
                            "
                        >
                            ➕ Invite
                        </span>

                    </div>

                `;

            }).join("");


        /*
            Use event listeners instead of putting
            the UUID directly into onclick="..."
        */

        results
            .querySelectorAll(
                ".search-user"
            )
            .forEach(element => {

                element.addEventListener(
                    "click",
                    () => {

                        inviteUser(
                            element.dataset.userId
                        );

                    }
                );

            });


    } catch (error) {

        console.error(
            "searchUsers:",
            error
        );


        results.innerHTML = `
            <p>
                😭 ${escapeHtml(
                    error.message
                )}
            </p>
        `;

    }

}


/* =========================================================
   INVITE USER
========================================================= */

async function inviteUser(userId) {

    if (!userId) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/houses/${encodeURIComponent(houseId)}/invite`,
                {

                    method: "POST",

                    credentials: "include",

                    headers: {
                        "Content-Type":
                            "application/json",
                        "Accept":
                            "application/json"
                    },

                    body: JSON.stringify({
                        userId
                    })

                }
            );


        const raw =
            await response.text();


        let data;


        try {

            data = JSON.parse(raw);

        } catch {

            throw new Error(
                "Invite request returned invalid data."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Failed to invite user."
            );

        }


        alert(
            "📨 Invitation sent!"
        );


    } catch (error) {

        alert(
            "😭 " + error.message
        );

    }

}


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHtml(value) {

    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

</script>
